<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBot Rescue - Recovery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="recovery-container">
    <div class="recovery-card">
      <h1>Recovery Mode Activated</h1>
      <p id="recoveryReasonText">You lost the level.</p>

      <div class="recovery-status-box">
        <p><strong>Robot Core Status:</strong> Critical</p>
        <p><strong>Recovery Time:</strong> <span id="recoveryTimer">10</span>s</p>
      </div>
       <div class="recovery-question-box">
        <h2>Heart Core Recovery Challenge</h2>
        <p id="recoveryQuestion">Loading recovery challenge...</p>

        <img id="heartPuzzle" src="" alt="Heart puzzle" width="300">

        <br><br>

        <input type="number" id="heartAnswer" placeholder="Enter the solution">

        <br><br>

        <button onclick="checkHeartAnswer()">Submit Answer</button>

        <p id="recoveryMessageBox"></p>
      </div>

      <div class="game-buttons">
        <button onclick="goToPage('login.html')">Back to Login</button>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
